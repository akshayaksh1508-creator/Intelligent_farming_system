<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login – Farm Wise AI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <link href="/static/css/main.css?v=4" rel="stylesheet">
  <style>
    body { background: #0f172a; color: white; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem; }
    .admin-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); border-radius: var(--radius-xl); padding: 2.5rem; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); }
    .admin-input { background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(255,255,255,0.1); color: white; border-radius: 8px; padding: 0.8rem 1rem; width: 100%; transition: all 0.2s; }
    .admin-input:focus { outline: none; border-color: var(--primary); background: rgba(15, 23, 42, 0.9); }
    .btn-admin { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: white; border: none; padding: 0.9rem; border-radius: 8px; font-weight: 700; width: 100%; transition: all 0.2s; cursor: pointer; }
    .btn-admin:hover { box-shadow: 0 10px 15px -3px rgba(5, 150, 105, 0.4); transform: translateY(-2px); }
  </style>
</head>
<body>

  <div style="width:100%;max-width:420px;">
    <div class="text-center mb-4">
      <div style="font-size:3rem;color:var(--primary);margin-bottom:0.5rem;"><i class="fas fa-shield-halved"></i></div>
      <h3 style="font-weight:800;letter-spacing:1px;">Farm Wise AI <span style="font-weight:300;">Admin</span></h3>
      <p style="color:var(--text-muted);font-size:0.9rem;text-transform:uppercase;letter-spacing:2px;">Authorized Personnel Only</p>
    </div>

    <div class="admin-card">
      <div id="errorMsg" class="alert alert-danger" style="display:none;background:rgba(220,38,38,0.1);border-color:#dc2626;color:#fca5a5;"></div>

      <form id="adminForm">
        <div class="mb-3">
          <label style="color:rgba(255,255,255,0.7);font-size:0.85rem;margin-bottom:0.5rem;display:block;">Email Address</label>
          <input type="email" id="email" class="admin-input" required placeholder="admin@farmwise.ai">
        </div>
        <div class="mb-4">
          <label style="color:rgba(255,255,255,0.7);font-size:0.85rem;margin-bottom:0.5rem;display:block;">Password</label>
          <div style="position:relative;">
            <input type="password" id="password" class="admin-input" required placeholder="••••••••">
            <button type="button" onclick="togglePwd()" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:rgba(255,255,255,0.5);">
              <i class="fas fa-eye" id="eyeIcon"></i>
            </button>
          </div>
        </div>
        <button type="submit" id="submitBtn" class="btn-admin">
          Secure Login <i class="fas fa-lock ms-2"></i>
        </button>
      </form>
    </div>
  </div>

<script>
function togglePwd() {
  const p = document.getElementById('password');
  const i = document.getElementById('eyeIcon');
  if (p.type === 'password') { p.type = 'text'; i.className = 'fas fa-eye-slash'; }
  else { p.type = 'password'; i.className = 'fas fa-eye'; }
}

document.getElementById('adminForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('submitBtn');
  btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Authenticating...';
  btn.disabled = true;
  document.getElementById('errorMsg').style.display = 'none';

  try {
    const res = await fetch('/api/admin/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        email: document.getElementById('email').value,
        password: document.getElementById('password').value
      })
    });
    const data = await res.json();
    if (data.success) {
      window.location.href = '/admin-dashboard.html';
    } else {
      document.getElementById('errorMsg').textContent = data.error || 'Login failed';
      document.getElementById('errorMsg').style.display = 'block';
      btn.innerHTML = 'Secure Login <i class="fas fa-lock ms-2"></i>';
      btn.disabled = false;
    }
  } catch (err) {
    document.getElementById('errorMsg').textContent = 'Network error';
    document.getElementById('errorMsg').style.display = 'block';
    btn.innerHTML = 'Secure Login <i class="fas fa-lock ms-2"></i>';
    btn.disabled = false;
  }
});
</script>
</body>
</html>
