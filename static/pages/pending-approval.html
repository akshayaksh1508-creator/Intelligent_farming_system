<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pending Approval – Farm Wise AI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <link href="/static/css/main.css?v=4" rel="stylesheet">
  <style>
    @keyframes pulse-icon {
      0% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.1); opacity: 0.8; }
      100% { transform: scale(1); opacity: 1; }
    }
    .pulse { animation: pulse-icon 2s infinite ease-in-out; }
  </style>
</head>
<body style="background:var(--bg-soft);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem;">

  <div class="text-center" style="width:100%;max-width:500px;">
    <div class="logo-icon mx-auto mb-3" style="font-size:2rem;background:white;width:60px;height:60px;display:flex;align-items:center;justify-content:center;border-radius:12px;box-shadow:0 4px 6px -1px rgba(0,0,0,0.1);">🌾</div>
    <h4 style="font-weight:800;color:var(--text-dark);margin-bottom:2rem;">Farm Wise <span style="color:var(--primary)">AI</span></h4>
    
    <div class="glass-card p-5" style="border-radius:var(--radius-xl);">
      <div style="font-size:4rem;color:var(--primary);margin-bottom:1.5rem;" class="pulse">
        <i class="fas fa-hourglass-half"></i>
      </div>
      <h3 style="font-weight:800;margin-bottom:1rem;">Account Under Review</h3>
      <p style="color:var(--text-muted);font-size:1rem;line-height:1.6;margin-bottom:2rem;">
        Your profile has been submitted successfully. Our admin team will review and approve your account shortly. You will be able to login once approved.
      </p>
      
      <a href="/index.html" class="btn-ghost-fw" style="justify-content:center;">
        <i class="fas fa-arrow-left me-2"></i> Back to Home
      </a>
    </div>
  </div>

</body>
</html>
