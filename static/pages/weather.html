<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather Intelligence – Farm Wise AI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <link href="/static/css/main.css?v=4" rel="stylesheet">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar-fw">
    <a href="/index.html" class="brand">
      <div class="logo-icon">🌾</div>
      <span>Farm Wise <span style="color:var(--primary)">AI</span></span>
    </a>
    <ul class="nav-links">
      <li><a href="/index.html">Home</a></li>
      <li><a href="/crop.html">Crop Rec.</a></li>
      <li><a href="/disease.html">Disease Detection</a></li>
      <li><a href="/weather.html" class="active">Weather</a></li>
      <li><a href="/marketplace.html">Marketplace</a></li>
      <li><a href="/schemes.html">Schemes</a></li>
      <li><a href="/carbon.html">Carbon Advisor</a></li>
    </ul>
    <div class="nav-actions" id="nav-auth-actions">
      <a href="/login.html" class="btn-ghost-fw">Login</a>
      <a href="/register.html" class="btn-primary-fw">Get Started</a>
    </div>
  </nav>

  <div style="padding-top:var(--navbar-h);min-height:100vh;background:var(--bg-soft);">
    <div class="container-fw py-4">
      
      <div class="d-flex align-items-center gap-3 mb-4">
        <h2 style="font-weight:900;" class="m-0">🌤️ Weather Intelligence</h2>
        <select id="citySelect" class="form-control-fw" style="width:auto;" onchange="fetchWeather()">
          <option>New Delhi</option>
          <option>Mumbai</option>
          <option>Bangalore</option>
          <option>Hyderabad</option>
          <option>Pune</option>
        </select>
      </div>

      <div class="row g-4">
        <div class="col-lg-5">
          <div class="glass-card p-4 text-white" style="background:linear-gradient(135deg,var(--primary),var(--primary-darker));border-radius:24px;">
            <div class="d-flex justify-content-between align-items-start">
              <div>
                <h5 id="wLoc">📍 New Delhi, India</h5>
                <div style="font-size:4rem;font-weight:900;" id="wTemp">34°C</div>
                <div style="font-size:1.2rem;" id="wCond">Partly Cloudy</div>
                <div class="mt-2" style="opacity:0.8;">Feels like <span id="wFeels">32°C</span></div>
              </div>
              <div style="font-size:5rem;">🌤️</div>
            </div>

            <div class="row text-center g-2 mt-4 pt-3" style="border-top:1px solid rgba(255,255,255,0.2);">
              <div class="col-4">
                <div style="font-size:1.2rem;">💧</div>
                <div style="font-weight:700;" id="wHum">62%</div>
                <div style="font-size:0.75rem;opacity:0.8;">Humidity</div>
              </div>
              <div class="col-4">
                <div style="font-size:1.2rem;">💨</div>
                <div style="font-weight:700;" id="wWind">15 km/h</div>
                <div style="font-size:0.75rem;opacity:0.8;">Wind</div>
              </div>
              <div class="col-4">
                <div style="font-size:1.2rem;">🌧️</div>
                <div style="font-weight:700;" id="wRain">25%</div>
                <div style="font-size:0.75rem;opacity:0.8;">Rain Prob.</div>
              </div>
            </div>
          </div>
        </div>

        <div class="col-lg-7">
          <div class="glass-card p-4">
            <h5 class="font-weight-bold mb-3">📅 7-Day Forecast</h5>
            <div id="weeklyForecast">
              <!-- Dynamically rendered -->
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script src="/static/js/main.js?v=4"></script>
  <script>
    async function fetchWeather() {
      const city = document.getElementById("citySelect").value;
      try {
        const res = await fetch(`/api/weather?location=${encodeURIComponent(city)}`);
        const data = await res.json();

        document.getElementById("wLoc").textContent = `📍 ${data.location}, ${data.region}`;
        document.getElementById("wTemp").textContent = `${data.temp}°C`;
        document.getElementById("wCond").textContent = data.condition;
        document.getElementById("wFeels").textContent = `${data.feels_like}°C`;
        document.getElementById("wHum").textContent = `${data.humidity}%`;
        document.getElementById("wWind").textContent = `${data.wind_speed} km/h`;
        document.getElementById("wRain").textContent = `${data.rain_chance}%`;

        const weekly = document.getElementById("weeklyForecast");
        weekly.innerHTML = data.weekly.map(w => `
          <div class="d-flex justify-content-between align-items-center py-2 border-bottom">
            <span style="font-weight:700;width:60px;">${w.day}</span>
            <span>🌤️ ${w.condition}</span>
            <span style="color:var(--accent);">💧 ${w.rain_chance}%</span>
            <span style="font-weight:700;">${w.max_temp}° / ${w.min_temp}°</span>
          </div>
        `).join("");
      } catch (err) {
        console.error(err);
      }
    }
    document.addEventListener("DOMContentLoaded", fetchWeather);
  </script>
</body>
</html>
