<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marketplace – Farm Wise AI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <link href="/static/css/main.css?v=4" rel="stylesheet">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar-fw">
    <a href="/index.html" class="brand">
      <div class="logo-icon">🌾</div>
      <span>Farm Wise <span style="color:var(--primary)">AI</span></span>
    </a>
    <ul class="nav-links">
      <li><a href="/index.html">Home</a></li>
      <li><a href="/crop.html">Crop Rec.</a></li>
      <li><a href="/disease.html">Disease Detection</a></li>
      <li><a href="/weather.html">Weather</a></li>
      <li><a href="/marketplace.html" class="active">Marketplace</a></li>
      <li><a href="/schemes.html">Schemes</a></li>
      <li><a href="/carbon.html">Carbon Advisor</a></li>
    </ul>
    <div class="nav-actions" id="nav-auth-actions">
      <a href="/login.html" class="btn-ghost-fw">Login</a>
      <a href="/register.html" class="btn-primary-fw">Get Started</a>
    </div>
  </nav>

  <div style="padding-top:var(--navbar-h);min-height:100vh;background:var(--bg-soft);">
    <div style="background:linear-gradient(135deg,#0c4a6e,#0ea5e9);padding:2.5rem 0;color:white;">
      <div class="container-fw">
        <h1 style="font-size:2rem;font-weight:900;">🛒 Agricultural Marketplace</h1>
        <p style="opacity:0.9;">High quality seeds, fertilizers, machinery & organic farming supplies.</p>
      </div>
    </div>

    <div class="container-fw py-4">
      <div class="d-flex gap-2 mb-4 overflow-auto pb-2">
        <button class="btn-primary-fw filter-btn" onclick="filterCategory('all', this)">🛒 All Products</button>
        <button class="btn-ghost-fw filter-btn" onclick="filterCategory('seeds', this)">🌱 Seeds</button>
        <button class="btn-ghost-fw filter-btn" onclick="filterCategory('fertilizers', this)">🌾 Fertilizers</button>
        <button class="btn-ghost-fw filter-btn" onclick="filterCategory('organic', this)">🪱 Organic</button>
        <button class="btn-ghost-fw filter-btn" onclick="filterCategory('irrigation', this)">💧 Irrigation</button>
        <button class="btn-ghost-fw filter-btn" onclick="filterCategory('machinery', this)">⚙️ Machinery</button>
      </div>

      <div class="row g-4" id="productsGrid">
        <!-- Dynamically rendered products -->
      </div>
    </div>
  </div>

  <script src="/static/js/main.js?v=4"></script>
  <script>
    let currentCat = "all";

    async function loadProducts() {
      try {
        const res = await fetch(`/api/marketplace/products?category=${currentCat}`);
        const products = await res.json();
        const grid = document.getElementById("productsGrid");

        grid.innerHTML = products.map(p => `
          <div class="col-lg-4 col-md-6">
            <div class="glass-card p-4 h-100 d-flex flex-column">
              <div style="font-size:3.5rem;" class="text-center mb-2">${p.emoji}</div>
              <div class="badge-gray mb-2 d-inline-block text-capitalize" style="width:fit-content;">${p.category}</div>
              <h5 style="font-size:1.1rem;font-weight:700;">${p.name}</h5>
              <div style="color:var(--text-muted);font-size:0.85rem;" class="mb-3">Brand: ${p.brand}</div>
              <div class="mt-auto pt-3 border-top d-flex justify-content-between align-items-center">
                <div>
                  <div style="font-size:1.4rem;font-weight:900;">₹${p.price}</div>
                  <div style="font-size:0.75rem;color:var(--text-muted);">per ${p.unit}</div>
                </div>
                <button onclick="alert('Added ${p.name} to cart!')" class="btn-primary-fw" style="padding:0.5rem 1rem;">
                  <i class="fas fa-cart-plus"></i> Add
                </button>
              </div>
            </div>
          </div>
        `).join("");
      } catch (err) {
        console.error(err);
      }
    }

    function filterCategory(cat, btn) {
      currentCat = cat;
      document.querySelectorAll('.filter-btn').forEach(b => b.className = 'btn-ghost-fw filter-btn');
      btn.className = 'btn-primary-fw filter-btn';
      loadProducts();
    }

    document.addEventListener("DOMContentLoaded", loadProducts);
  </script>
</body>
</html>
