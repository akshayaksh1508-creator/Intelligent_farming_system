<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password – Farm Wise AI</title>

    <!-- Main CSS -->
    <link rel="stylesheet" href="../../static/css/main.css">

    <!-- Optional Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#f0fdf4,#ffffff);padding:5rem 1rem 2rem;">

    <div style="width:100%;max-width:420px;">

        <div class="text-center mb-4">

            <a href="index.html"
               style="font-size:1.4rem;font-weight:800;color:var(--text);display:inline-flex;align-items:center;gap:0.5rem;margin-bottom:1.5rem;text-decoration:none;">
                🌾 Farm Wise AI
            </a>

            <div style="font-size:3rem;margin-bottom:0.5rem;">🔑</div>

            <h1 style="font-size:1.6rem;font-weight:800;margin-bottom:0.5rem;">
                Reset Password
            </h1>

            <p style="color:var(--text-muted);font-size:0.9rem;">
                Enter your email and we'll send you a reset link
            </p>

        </div>

        <div class="glass-card" style="padding:2rem;">

            <form method="POST">

                <div class="form-group-fw mb-4">
                    <label>Email Address</label>

                    <input
                        type="email"
                        name="email"
                        class="form-control-fw"
                        placeholder="your@email.com"
                        required>
                </div>

                <button
                    type="submit"
                    class="btn-primary-fw w-100"
                    style="justify-content:center;padding:0.85rem;">
                    Send Reset Link
                </button>

            </form>

            <div class="text-center mt-3">

                <a href="login.html"
                   style="font-size:0.875rem;color:var(--primary);text-decoration:none;">
                    ← Back to Login
                </a>

            </div>

        </div>

    </div>

</div>

</body>
</html>
